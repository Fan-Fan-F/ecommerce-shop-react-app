name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
      - run: npm ci
      - name: Test
        run: npm test -- --watchAll=false --passWithNoTests
        env:
          CI: true
      - name: Build
        run: npm run build
      - name: Ensure build output is not committed
        run: |
          git status --porcelain
          test -z "$(git status --porcelain | grep '^?? build/' || true)" && echo "build/ untracked OK"
